onboarding = false
# ~/.config/herdr/config.toml
#
# herdr config mirroring the tmux setup in ../../tmux/.tmux.conf.
# Kept alongside the tmux config (both are tracked); either multiplexer works.
#
# herdr live-reloads this file on save. To verify key syntax against the
# installed version, run `herdr --default-config` (prints the annotated
# defaults) and `herdr server reload-config` (warns on invalid key combos).
#
# Three tmux features have no 1:1 herdr equivalent; see NOTES at the bottom.

# ============================================
# KEY BINDINGS
# ============================================
[keys]
# tmux: unbind C-b; set prefix C-a. herdr defaults to ctrl+b.
prefix = "ctrl+a"

# Splits. tmux: `|` splits side-by-side, `-` splits stacked (both keep cwd).
# herdr names splits by the divider orientation: split_vertical draws a
# vertical divider (panes side-by-side), split_horizontal a horizontal one
# (panes stacked). cwd inheritance is handled once by [terminal].new_cwd
# below, so it covers splits and new tabs alike.
# NOTE: if herdr rejects the literal "|" token, use "prefix+shift+backslash".
split_vertical   = "prefix+|"      # tmux: bind | split-window -h
split_horizontal = "prefix+minus"  # tmux: bind - split-window -v

# New tab (tmux: bind c new-window). cwd handled by [terminal].new_cwd.
new_tab = "prefix+c"
detach = "prefix+d"

# Vim-style pane focus (tmux: bind h/j/k/l select-pane -L/-D/-U/-R).
# These already match herdr's defaults; set explicitly to mirror tmux 1:1.
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"

# Reload config (tmux: bind r source-file ~/.tmux.conf). herdr also reloads
# on save, so this is mainly muscle memory. This takes herdr's default
# reload key (prefix+shift+r) and moves it to prefix+r to match tmux, which
# is why resize_mode below moves off prefix+r.
reload_config = "prefix+r"

# Resize. tmux used repeatable prefix+H/J/K/L (resize-pane by 5). herdr
# resizing is modal: this enters resize mode, then h/j/k/l nudge the border
# (esc/enter exits). Placed on shift+r so it does not clash with reload above.
resize_mode = "prefix+shift+r"

# Copy / scrollback mode (tmux: default copy-mode on prefix+[, mode-keys vi).
copy_mode = "prefix+["

# Select/switch between agents
next_agent="prefix+s"
previous_agent="prefix+a"
# Jump straight to agent row N in the sidebar, no prefix. Tabs stay on the
# herdr default prefix+1..9. Requires the terminal to transmit ctrl+number
# distinctly (works in wezterm; plain Terminal.app may swallow these).
focus_agent = "prefix+shift+1..9"

# ============================================
# TERMINAL
# ============================================
[terminal]
# tmux ran the login shell; keep zsh explicit.
default_shell = "/bin/zsh"
# tmux kept the current pane's path on split/new-window
# (-c "#{pane_current_path}"). "follow" opens new panes/tabs in the active
# pane's cwd.
new_cwd = "follow"

# ============================================
# UI  (herdr's sidebar stands in for the tmux status bar)
# ============================================
[ui]
# tmux: set -g mouse on
mouse_capture = true
# Closest analog to the tmux window-status list: label each pane's border
# with what is running in it.
show_agent_labels_on_pane_borders = true

# ============================================
# THEME
# ============================================
# tmux used a hand-rolled dark palette: bg #13161d, fg #8b949e, accent green
# #00e68a, borders #30363d. herdr themes are named, so this starts from a dark
# base and overrides individual tokens. The target is no longer the old tmux
# look but the wezterm "glacier" scheme, plus transparency: herdr sits inside
# wezterm, so it should paint as little background as possible and let the
# terminal's blurred wallpaper through.
[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
# "reset" makes herdr emit the terminal's default background instead of
# painting a solid color, so wezterm's window_background_opacity (0.8) and
# macos_window_background_blur show through the sidebar and pane gaps. The
# old tmux status bg (#13161d) was opaque and covered that up.
panel_bg = "reset"
# panel_bg only clears the panel fill. Each entry in the sidebar's "spaces" and
# "agents" lists is painted on its own row band from the surface* family, which
# stayed opaque catppuccin (surface0 #313244 for a normal row, surface1 #45475a
# for the active one) and showed as solid bars floating in the transparent rail.
#
# Token-to-element mapping, read off the herdr source rather than guessed:
#   surface0     sidebar row band, inactive rows       (ui/sidebar.rs:795)
#   surface_dim  sidebar row band, ACTIVE row          (ui/sidebar.rs:797)
#   surface1     workspace/agent state fill            (ui/sidebar.rs:1241)
# Any color value accepts reset / default / none / transparent as aliases.
#
# surface_dim is left "reset" deliberately: no single value fixes every role.
# The active tab title is drawn as
#   fg(panel_contrast_fg(p)).bg(p.accent)                  (ui/tabs.rs:325)
# and panel_contrast_fg falls back to surface_dim when panel_bg is Reset:
#   match p.panel_bg { Color::Reset => p.surface_dim, .. } (ui/widgets.rs:32)
# So with both cleared the title fg falls through to the terminal foreground
# (#D7E7CE) on the accent. Measured against the CURRENT accent, #B67A20:
#
#   reset (now)  2.78:1 title | separator and active row take terminal defaults
#   #4B570C      2.19:1 title | 2.07:1 separator | 6.09:1 ice on active row
#   #1B2201      4.54:1 title | 1.00:1 separator, invisible
#
# An earlier version of this comment said surface_dim must NOT be reset and
# recommended #4B570C at 5.31:1. That was computed when accent was #EEB78E,
# and is stale twice over: the accent moved to #B67A20, and #4B570C is now the
# WORST of the three for the title. Only #1B2201 clears 4.5:1, and it is
# unusable as a separator. One token fills three roles with opposite lightness
# requirements, so the fix belongs upstream in panel_contrast_fg rather than
# here. Tracked as issue #2. Do not "restore" a value here without
# re-measuring against whatever accent is in force at the time.
surface0    = "reset"
surface1    = "reset"
surface_dim = "reset"
accent   = "#B67A20"  # palette accent: active tab bg, active pane border, nav
# The branch line under a space is drawn mauve when that space is selected or
# active, overlay0 grey otherwise  (ui/sidebar.rs:1290). Catppuccin mauve is
# #cba6f7, the leftover purple. mauve is used in only three places: this branch
# line, the keybind help overlay (ui/keybind_help.rs:209), and a menu highlight
# background (ui/menus.rs:267).
mauve    = "#FAC094"  # palette cursor: branch line of the active space
#green    = "#00e68a"  # still the old tmux green, used for agent state icons

# ============================================
# SCROLLBACK
# ============================================
# tmux: set -g history-limit 50000 (lines). herdr caps scrollback by bytes,
# not lines, so this is an equivalent-scale ceiling rather than an exact 50000.
[advanced]
scrollback_limit_bytes = 10000000

# ============================================
# SESSION PERSISTENCE  (replaces tmux-resurrect + tmux-continuum)
# ============================================
[session]
# herdr's resident server keeps panes/tabs/sessions alive across detach and
# server restarts, so the resurrect/continuum plugins are not needed. This
# resumes agent conversations after a restart, the closest analog to
# @continuum-restore 'on'.
resume_agents_on_restore = true

# ============================================
# NOTES: tmux features with no direct herdr equivalent
# ============================================
# 1. Status bar widgets. tmux drew a top status bar with the session name and
#    an Amsterdam-timezone clock/date (status-left / status-right). herdr has
#    an agent-state sidebar instead of a text status bar; the clock/date have
#    no native widget. The accent color above is no longer the tmux green; it
#    is sampled from the wezterm glacier palette so herdr's chrome matches the
#    terminal. `green` still holds the tmux value.
# 2. Plugins (TPM). set -g @plugin lines and `run tpm` have no herdr analog;
#    persistence is built into the server (see [session] above).
# 3. tmux terminal tuning -- escape-time, focus-events, aggressive-resize,
#    default-terminal, terminal-features RGB, base-index/renumber-windows --
#    is handled internally by herdr and has no config surface here.

[experimental]
switch_ascii_input_source_in_prefix = true
