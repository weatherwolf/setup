# starship prompt config -> ~/.config/starship.toml
#
# Replaces powerlevel10k. Deliberately minimal: an idle prompt shows the current
# path and nothing else, on a single line.
#
# starship only renders the modules named in `format`, so every other module
# (git, language versions, cloud contexts, clock, exit status, ...) is off simply
# by not being listed -- no per-module `disabled = true` needed. Adding one back
# means adding its `$name` to `format` below.
#
# ASCII-only, so the prompt renders identically in any terminal or font.

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = '$directory$character'

# Same blues as the wezterm "glacier_wave" scheme in ../../.wezterm.lua, sampled
# from the icy blue wallpaper. The full palette, with every consumer and every
# contrast ratio, is indexed in ../../palettes/glacier-wave.md.
#
# Written as hex rather than as ANSI names ('cyan',
# 'blue') so the prompt stays this exact palette even in a terminal themed
# differently, for example over SSH.
#
# That choice is what keeps the prompt glacier now that .wezterm.lua no longer
# overrides the 16 ANSI slots: an ANSI-named prompt would have reverted to
# wezterm's default palette along with every other tool.
palette = 'active'

[palettes.active]
ice_bright = '#F8F3EF'
ice = '#EDDED2'
cyan_light = '#C6D4AE'
cyan = '#B5C799'
cyan_deep = '#9EB687'
azure = '#8DA978'
azure_deep = '#7E9F6C'
teal_deep = '#6F9062'
deep_water = '#1F1102'

# Greys, on the same hue axis as the blues above (hue 221.5, chroma 0.020) so
# they read as part of the palette rather than beside it. Derived in OKLab, not
# sampled. Nothing renders them yet; they are defined here so the ramp lives
# somewhere a config can reach, and are indexed with their roles and contrast in
# ../../palettes/glacier-wave.md.
mist = '#B9AFA5'   # secondary text          7.67:1
silt = '#9D9389'   # dim text, comments      5.50:1
scree = '#6C805B'  # borders, separators     2.75:1, fill only
till = '#3A3026'   # raised surface          1.53:1, fill only

[directory]
style = 'bold cyan_light'
truncation_length = 3
truncate_to_repo = false
truncation_symbol = '.../'
read_only = ' [ro]'
read_only_style = 'ice_bright'

# No git module tables here on purpose. Four of them (git_branch, git_status,
# git_commit, git_state) used to sit at this point in the file, fully
# configured but absent from `format`, so none of them ever rendered. They also
# styled themselves with ANSI names (bold red, bold purple) rather than palette
# entries, and carried emoji, contradicting both the palette note above and the
# ASCII-only note at the top. Removed rather than left as a trap: adding
# `$git_branch` to `format` would have silently pulled in off-palette colors.
# Recover them from git history if you want them back, but restyle first.

# The one thing besides the path: where typing starts. With no red left in the
# palette, a failed command is signalled by BRIGHTNESS -- the character jumps from
# a receding mid teal to the lightest ice blue -- rather than by hue.
[character]
success_symbol = '[>](teal_deep)'
error_symbol = '[>](bold ice_bright)'
vicmd_symbol = '[<](bold cyan)'
